{% extends "base.html" %}

{% block title %}Admin Login | Skill Link{% endblock %}

{% block content %}
<div class="container container-xs">
  <a href="{{ url_for('home') }}" class="btn-back">&larr; Back to Home</a>
  <div class="card" style="box-shadow: var(--shadow-lg); border-top: 4px solid #f59e0b;">
    <div style="text-align: center; margin-bottom: 2rem;">
      <div style="font-size: 2.2rem; margin-bottom: 0.5rem;">🛡️</div>
      <h1 class="page-title">Admin Portal</h1>
      <p class="page-subtitle">College administrator access for Skill Link.</p>
    </div>

    <form method="POST" action="{{ url_for('admin_login') }}">
      <div class="form-group">
        <label class="form-label" for="username">Admin Username</label>
        <input type="text" class="form-control" id="username" name="username" 
               placeholder="Enter admin username" required autofocus>
      </div>

      <div class="form-group">
        <label class="form-label" for="password">Admin Password</label>
        <input type="password" class="form-control" id="password" name="password" 
               placeholder="Enter admin password" required>
      </div>

      <button type="submit" class="btn btn-primary btn-lg btn-block" style="margin-top: 1.5rem; background: #0f172a; border-color: #0f172a;">
        Authorize & Enter Dashboard &rarr;
      </button>
    </form>
  </div>
</div>
{% endblock %}
