{% extends "base.html" %}

{% block title %}Server Error (500) | Skill Link{% endblock %}

{% block content %}
<div class="container container-xs" style="text-align: center; padding: 4rem 1rem;">
  <div style="font-size: 4rem; margin-bottom: 1rem;">⚙️</div>
  <h1 style="font-size: 2.2rem; font-weight: 800; color: var(--text-primary); margin-bottom: 0.5rem;">500 - Internal Server Error</h1>
  <p style="color: var(--text-secondary); margin-bottom: 2rem;">
    Something went wrong on the server. Please try again or return to the home page.
  </p>
  <a href="{{ url_for('home') }}" class="btn btn-primary btn-lg">
    &larr; Return to Home Page
  </a>
</div>
{% endblock %}
