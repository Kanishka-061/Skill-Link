{% extends "base.html" %}

{% block title %}Student Login | Skill Link{% endblock %}

{% block content %}
<div class="container container-xs">
  <a href="{{ url_for('home') }}" class="btn-back">&larr; Back to Home</a>
  <div class="card" style="box-shadow: var(--shadow-lg);">
    <div style="text-align: center; margin-bottom: 2rem;">
      <div style="font-size: 2.2rem; margin-bottom: 0.5rem;">🔑</div>
      <h1 class="page-title">Student Login</h1>
      <p class="page-subtitle">Access your personalized Skill Link dashboard.</p>
    </div>

    <form method="POST" action="{{ url_for('student_login') }}">
      <div class="form-group">
        <label class="form-label" for="college_email">College Email ID</label>
        <input type="email" class="form-control" id="college_email" name="college_email" 
               value="{{ college_email or '' }}" placeholder="student@college.edu" required autofocus>
      </div>

      <div class="form-group">
        <label class="form-label" for="password">Password</label>
        <input type="password" class="form-control" id="password" name="password" 
               placeholder="Enter your password" required>
      </div>

      <button type="submit" class="btn btn-primary btn-lg btn-block" style="margin-top: 1.5rem;">
        Log In to Dashboard &rarr;
      </button>

      <div style="margin-top: 1.75rem; text-align: center; font-size: 0.92rem; color: var(--text-secondary); border-top: 1px solid var(--border-color); padding-top: 1.25rem;">
        New to Skill Link? 
        <a href="{{ url_for('student_register') }}" style="font-weight: 600;">Create an Account</a>
      </div>
    </form>
  </div>
</div>
{% endblock %}
